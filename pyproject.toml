[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pyas2"
version = "1.2.3"
description = "AS2 file transfer Server built on Python and Django."
readme = "README.rst"
license = "GPL-3.0-only"
authors = [{ name = "Abhishek Ram", email = "abhishek8816@gmail.com" }]
urls = { Homepage = "http://github.com/abhishek-ram/django-pyas2" }
requires-python = ">=3.14"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications",
]
dependencies = [
    "pyas2lib",
    "oscrypto @ git+https://github.com/wbond/oscrypto.git@1547f53",
    "django>=6,<7",
    "requests",
]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "coverage",
    "ruff",
]
docs = [
    "sphinx>=7",
    "sphinx-version-warning>=1.1.2",
    "alabaster>=0.7.12",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["pyas2*"]

[tool.setuptools.package-data]
pyas2 = ["templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.settings"

[tool.coverage.run]
omit = [
    "pyas2/apps.py",
    "pyas2/forms.py",
    "pyas2/admin.py",
    "pyas2/templatetags/pyas2.py",
    "pyas2/tests/*",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["**/migrations/**", "**/tests/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E714"]

[tool.tox]
requires = ["tox>=4"]
env_list = ["py314"]

[tool.tox.env_run_base]
extras = ["tests"]
set_env = { PYTHONPATH = "{tox_root}" }
allowlist_externals = ["make"]
commands = [["make", "test"]]
